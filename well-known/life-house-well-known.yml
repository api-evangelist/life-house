  controlled. lifehousehotels.com issues an HTTP 301 to www.larkhotels.com (AmazonS3 origin
  behind CloudFront) for every path following the December 2024 Lark Hospitality joint venture,
  so every probe below is answered by the successor brand's edge and every discovery document
  returns 404. No pointer of type WellKnown is emitted: this file records an absence, not a
  served surface.
