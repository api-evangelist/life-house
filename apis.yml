aid: life-house
name: Life House
description: >-
  Life House was a vertically integrated hotel software, brand and management company founded in
  2017 and headquartered in Miami Beach, Florida. It built its own back-of-house operating system —
  property management, revenue management, digital marketing and financial operations — for
  independent hotels, ran more than 50 properties across the United States, Mexico and Canada, and
  from 2021 sold the platform to third-party hoteliers. It raised over $100M from Inovia Capital,
  KAYAK, Tiger Global, Trinity Ventures, Sound Ventures and JLL. In December 2024 Life House
  combined its management portfolio with Lark Hotels to form Lark Hospitality — in which Lark holds
  the controlling interest — and spun its AI revenue-management platform out as Diamo. Life House
  never operated a public developer program: it was a consumer of hotel APIs (notably the Mews Open
  API) rather than a publisher of one, lifehousehotels.com now 301-redirects to larkhotels.com, no
  api/developer/docs subdomain resolves in DNS, and its GitHub organization holds a single fork of
  a third-party JavaScript library.
